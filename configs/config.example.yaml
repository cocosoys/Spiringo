app:
  name: spiringo
  env: local
  debug: true

server:
  host: "127.0.0.1"
  port: 8080
  addr: "" # optional: when set, overrides host + port, e.g. ":8080"
  mode: "debug"
  public_url: "http://127.0.0.1:8080"
  api_base_url: "http://127.0.0.1:8080/api/v1"

log:
  driver: "slog"
  level: "info"
  format: "json"
  output: "stdout"

config_center:
  enabled: false
  type: "nacos"
  nacos:
    server_addr: "127.0.0.1:8848"
    namespace: "public"
    group: "DEFAULT_GROUP"
    data_id: "spiringo.yaml"
  consul:
    address: "127.0.0.1:8500"
    scheme: "http"
    key: "spiringo/config.yaml"

database:
  default:
    driver: "mysql"
    dsn: "root:password@tcp(127.0.0.1:3306)/spiringo?charset=utf8mb4&parseTime=True&loc=Local"
    max_idle: 10
    max_open: 100
    conn_max_lifetime: "1h"
    read_replicas: []

redis:
  default:
    addr: "127.0.0.1:6379"
    password: ""
    db: 0

cache:
  driver: "memory"

mq:
  enabled: false
  driver: "redis_stream"

lock:
  enabled: false
  driver: "redis"

storage:
  enabled: false
  type: "minio"

search:
  enabled: false
  driver: "elasticsearch"

metrics:
  enabled: true
  path: "/metrics"
  report_path: "/metrics/report"
  namespace: "spiringo"

alert:
  enabled: false
  logger: true

trace:
  enabled: false
  exporter: "logger"

modules:
  auth:
    enabled: true
    jwt:
      secret: "change-me"
      access_expire: "2h"
      refresh_expire: "168h"
      issuer: "spiringo"
  user:
    enabled: true
  tenant:
    enabled: true
    strategy: "shared_db"
  rbac:
    enabled: true
  payment:
    enabled: false
  qrcode:
    enabled: true
  notification:
    enabled: false

middleware:
  recovery: true
  cors: true
  request_id: true
  tenant: true
  rate_limit:
    enabled: true
    strategy: "sliding_window"
    rate: 100
    burst: 200
  circuit_break:
    enabled: false
  auth:
    enabled: false
    jwt_secret: ""
    public_paths:
      - "/health"
      - "/ready"
      - "/metrics"
      - "/metrics/report"
      - "/system/report"
      - "/system/report.json"
      - "/api/v1/auth/login"
      - "/api/v1/auth/register"
      - "/api/v1/auth/refresh"
      - "/api/v1/auth/oauth/*"
      - "/api/v1/payment/callback/*"
      - "/api/v1/qrcode/s/*"
  idempotent:
    enabled: false
    header: "X-Idempotent-Key"
  i18n: false

environments:
  local:
    app:
      env: local
      debug: true
    server:
      host: "127.0.0.1"
      port: 8080
      addr: ""
      mode: "debug"
      public_url: "http://127.0.0.1:8080"
      api_base_url: "http://127.0.0.1:8080/api/v1"
    database:
      default:
        driver: "sqlite"
        dsn: "file:spiringo_local?mode=memory&cache=shared"
    cache:
      driver: "memory"
    mq:
      enabled: false
    lock:
      enabled: false
    middleware:
      rate_limit:
        enabled: false
      auth:
        enabled: false

  dev:
    app:
      env: dev
      debug: true
    server:
      host: "0.0.0.0"
      port: 8080
      addr: ""
      mode: "debug"
      public_url: "http://127.0.0.1:8080"
      api_base_url: "http://127.0.0.1:8080/api/v1"
    database:
      default:
        driver: "sqlite"
        dsn: "file:spiringo_dev?mode=memory&cache=shared"
    cache:
      driver: "memory"
    mq:
      enabled: false
    lock:
      enabled: false
    middleware:
      rate_limit:
        enabled: true
      auth:
        enabled: false

  prod:
    app:
      env: prod
      debug: false
    server:
      host: "0.0.0.0"
      port: 8080
      addr: ""
      mode: "release"
      public_url: "https://api.example.com"
      api_base_url: "https://api.example.com/api/v1"
    database:
      default:
        driver: "mysql"
        dsn: "replace-with-production-dsn"
    cache:
      driver: "redis"
    mq:
      enabled: true
    lock:
      enabled: true
    middleware:
      rate_limit:
        enabled: true
      auth:
        enabled: true
        jwt_secret: "replace-with-production-secret"
