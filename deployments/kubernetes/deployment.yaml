apiVersion: apps/v1
kind: Deployment
metadata:
  name: spiringo
  labels:
    app: spiringo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: spiringo
  template:
    metadata:
      labels:
        app: spiringo
    spec:
      containers:
        - name: spiringo
          image: spiringo:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: spiringo-config
            - secretRef:
                name: spiringo-secret
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
