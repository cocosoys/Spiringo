    PaymentChannel:
      type: string
      enum: [wechat, alipay, unionpay, cloudpay, digital_rmb, stripe, paypal]
    PaymentScene:
      type: string
      enum: [jsapi, app, h5, native, qrcode]
    PaymentStatus:
      type: string
      enum: [pending, paid, failed, closed, refunding, refunded]
    CreatePaymentRequest:
      type: object
      required: [out_trade_no, amount, subject, channel, scene]
      properties:
        out_trade_no:
          type: string
          minLength: 1
          maxLength: 64
        amount:
          type: integer
          format: int64
          minimum: 1
          description: Amount in minor units.
        currency:
          type: string
          maxLength: 8
          default: CNY
        subject:
          type: string
          maxLength: 256
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        scene:
          $ref: "#/components/schemas/PaymentScene"
        notify_url:
          type: string
          maxLength: 512
        return_url:
          type: string
          maxLength: 512
        open_id:
          type: string
          maxLength: 128
    RefundRequest:
      type: object
      required: [out_trade_no, out_refund_no, total_amount, refund_amount]
      properties:
        out_trade_no:
          type: string
        out_refund_no:
          type: string
        total_amount:
          type: integer
          format: int64
          minimum: 1
        refund_amount:
          type: integer
          format: int64
          minimum: 1
        reason:
          type: string
          maxLength: 256
    PaymentOrderResponse:
      type: object
      properties:
        id:
          type: string
        out_trade_no:
          type: string
        trade_no:
          type: string
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        scene:
          $ref: "#/components/schemas/PaymentScene"
        amount:
          type: integer
          format: int64
        currency:
          type: string
        subject:
          type: string
        status:
          $ref: "#/components/schemas/PaymentStatus"
        pay_url:
          type: string
        qr_code:
          type: string
        pay_params:
          nullable: true
          oneOf:
            - type: object
              additionalProperties: true
            - type: string
    PaymentModel:
      allOf:
        - $ref: "#/components/schemas/PaymentOrderResponse"
        - type: object
          properties:
            user_id:
              type: string
            notify_url:
              type: string
            return_url:
              type: string
            paid_at:
              type: string
              format: date-time
              nullable: true
            expired_at:
              type: string
              format: date-time
              nullable: true
    Refund:
      type: object
      properties:
        id:
          type: string
        out_refund_no:
          type: string
        out_trade_no:
          type: string
        refund_no:
          type: string
        total_amount:
          type: integer
          format: int64
        refund_amount:
          type: integer
          format: int64
        reason:
          type: string
        status:
          type: string
        channel:
          $ref: "#/components/schemas/PaymentChannel"
        refunded_at:
