name: CI

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "1"
      GOARCH: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Download dependencies
        run: go mod download

      - name: Test
        run: go test ./...

      - name: Build server
        run: go build -o bin/spiringo ./cmd/spiringo

      - name: Build CLI
        run: go build -o bin/spiringo-cli ./cmd/spiringo-cli

      - name: Build serverless entry
        run: go build -o bin/spiringo-serverless ./cmd/spiringo-serverless
